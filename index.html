<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MH Wilds - Sorteador de Caça</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quattrocento:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sand: #eaddca;
            --dark-leather: #2b1d0e;
            --gold: #b8860b;
            --accent: #8b4513;
        }
        body {
            background-color: #1a1a1a;
            color: var(--dark-leather);
            font-family: 'Quattrocento', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative; /* Necessário para o posicionamento do fundo */
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('MH.imgs/source.gif');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            opacity: 0.3; /* AJUSTE A OPACIDADE AQUI (0.0 a 1.0) */
            z-index: -1;   /* Garante que o fundo fique atrás do conteúdo */
    }

            

        .quest-board {
            background: var(--sand);
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border: 15px solid var(--dark-leather);
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            position: relative;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
        }

        h1 {
            font-family: 'Cinzel', serif;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 30px;
            color: var(--accent);
            font-size: 1.4em;
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        select {
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--accent);
            font-family: 'Quattrocento', serif;
        }

        .btn-hunt {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: white;
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 1.2em;
            cursor: pointer;
            transition: 0.3s;
        }   

        .btn-hunt:hover {
            background: var(--dark-leather);
            letter-spacing: 2px;
        }

        #result {
            margin-top: 30px;
            text-align: center;
            min-height: 100px;
            padding: 20px;
            border: 2px dashed var(--accent);
            display: none;
        }

    
         /* CONFIGURAÇÃO PARA FOTOS/RENDERS DE MONSTROS */
        .monster-icon {
            width: 90%;            /* Ocupa a largura total disponível */
            height: auto;           /* Altura automática para não achatar nem cortar */
            max-height: 150px;      /* Define um limite máximo de altura para não quebrar o layout */
            object-fit: contain;    /* Garante que a imagem inteira apareça dentro do espaço */
            margin: 0 auto 20px;
            display: block;
            filter: drop-shadow(5px 5px 15px rgba(121, 10, 155, 0.3)); }

      .monster-name {
            font-size: 1.6em;
            font-family: 'Cinzel', serif;
            color: #4e342e;
            display: block;
      }
        .stars {
            color: var(--gold);
            font-size: 1.5em;
        }
    </style>
</head>
<body>

<div class="quest-board">
    <h1>Qual monstro Sillas vai caçar hoje?</h1>
    
    <div class="filters">
        <label for="difficulty">Dificuldade (★):</label>
        <select id="difficulty">
            <option value="2">★★</option>
            <option value="3">★★★</option>
            <option value="4">★★★★</option>
            <option value="5">★★★★★</option>
            <option value="6">★★★★★★</option>
            <option value="7">★★★★★★★</option>
            <option value="8">★★★★★★★★</option>
            <option value="9">★★★★★★★★★</option>
        </select>
    </div>

    <button class="btn-hunt" onclick="sortearMonstro()">INICIAR CAÇADA</button>

    <div id="result">
        <img id="monster-img" class="monster-icon" src="" alt="Ícone do Monstro">
        <span class="monster-name" id="monster-name">---</span>
        <div class="stars" id="monster-stars"></div>
    </div>
</div>

<script>
    const monstros = [
        // ADICIONE A IMAGEM ASSIM: { nome: "Nome", estrelas: X, img: "MH.imgs/arquivo.png" },
        { nome: "Blangonga", estrelas: 2, img: "MH.imgs/Blangonga_Icon.webp" },
        { nome: "Chatacabra", estrelas: 2, img: "MH.imgs/Chatacabra_Icon.webp" },
        { nome: "Congalala", estrelas: 2, img: "MH.imgs/Congalala_Icon.webp" },
        { nome: "Doshaguma", estrelas: 2, img: "MH.imgs/Doshaguma_Icon.webp" },
        { nome: "Gypceros", estrelas: 2, img: "MH.imgs/Gypceros_Icon.webp" },
        { nome: "Balahara", estrelas: 3, img: "MH.imgs/Balahara_Icon.webp" },
        { nome: "Guardian Doshaguma", estrelas: 3, img: "MH.imgs/Guardian_Doshaguma_Icon.webp" },
        { nome: "Hirabami", estrelas: 3, img: "MH.imgs/Hirabami_Icon.webp" },
        { nome: "Nerscylla", estrelas: 3, img: "MH.imgs/Nerscylla_Icon.webp" },
        { nome: "Quematrice", estrelas: 3, img: "MH.imgs/Quematrice_Icon.webp" },
        { nome: "Yian Kut-Ku", estrelas: 3, img: "MH.imgs/Yian_Kut-Ku_icon.webp" },
        { nome: "Ajarakan", estrelas: 4, img: "MH.imgs/Ajarakan.webp" },
        { nome: "Lala Barina", estrelas: 4, img: "MH.imgs/Lala_Barina_Icon.webp" },
        { nome: "Rathian", estrelas: 4, img: "MH.imgs/Rathian_Icon.webp" },
        { nome: "Rompopolo", estrelas: 4, img: "MH.imgs/Rompopolo_Icon.webp" },
        { nome: "Rathalos", estrelas: 5, img: "MH.imgs/Rathalos_Icon.webp" },
        { nome: "Rey Dau", estrelas: 5, img: "MH.imgs/Rey_Dau_Icon.webp" },
        { nome: "Uth Duna", estrelas: 5, img: "MH.imgs/Uth_Duna_Icon.webp" },
        { nome: "Jin Dahaad", estrelas: 6, img: "MH.imgs/Jin_Dahaad_Icon.webp" },
        { nome: "Nu Udra", estrelas: 6, img: "MH.imgs/Nu_Udra_Icon.webp" },
        { nome: "Xu Wu", estrelas: 6, img: "MH.imgs/Xu_Wu_Icon.webp" },
        { nome: "Gore Magala", estrelas: 7, img: "MH.imgs/Gore_Magala_Icon.webp" },
        { nome: "Gravios", estrelas: 7, img: "MH.imgs/Gravios_Icon.webp" },
        { nome: "Lagiacrus", estrelas: 7, img: "MH.imgs/Lagiacrus_Icon.webp" },
        { nome: "Mizutsune", estrelas: 7, img: "MH.imgs/Mizutsune_Icon.webp" },
        { nome: "Guardian Rathalos", estrelas: 7, img: "MH.imgs/Guardian_Rathalos_Icon.webp" },
        { nome: "Arkveld", estrelas: 8, img: "MH.imgs/Arkveld.webp" },
        { nome: "Guardian Ebony Odogaron", estrelas: 8, img: "MH.imgs/Guardian_Ebony_Odogaron_Icon.webp" },
        { nome: "Guardian Fulgur Anjanath", estrelas: 8, img: "MH.imgs/Guardian_Fulgur_Anjanath_Icon.webp" },
        { nome: "Seregios", estrelas: 8, img: "MH.imgs/Seregios_Icon.webp" },
        { nome: "Guardian Arkveld", estrelas: 9, img: "MH.imgs/Guardian_Arkveld_Icon.webp" },
        { nome: "Gogmazios", estrelas: 9, img: "MH.imgs/Gogmazios_Icon.webp" },
        { nome: "Omega Planetes", estrelas: 9, img: "MH.imgs/Omega_Planetes_Icon.webp" },
        { nome: "Zoh Shia", estrelas: 9, img: "MH.imgs/Zoh_Shia_icon.webp" }
    ];

    function sortearMonstro() {
        const diffSel = parseInt(document.getElementById('difficulty').value);
        const resultDiv = document.getElementById('result');

        const possiveis = monstros.filter(m => m.estrelas === diffSel);

        if (possiveis.length > 0) {
            const sorteado = possiveis[Math.floor(Math.random() * possiveis.length)];
            
            document.getElementById('monster-name').innerText = sorteado.nome;
            document.getElementById('monster-stars').innerText = "★".repeat(sorteado.estrelas);
            
            const imgElement = document.getElementById('monster-img');
            
            if (sorteado.img) {
                imgElement.src = sorteado.img;
                imgElement.style.display = "block";
            } else {
                imgElement.style.display = "none"; // Esconde a aba de imagem se não houver arquivo
            }
            
            resultDiv.style.display = "block";
        } else {
            alert("Nenhum monstro encontrado para essa dificuldade!");
        }
    }
</script>

</body>
</html>
